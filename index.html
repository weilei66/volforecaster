<!DOCTYPE html>
<html>
<<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="manifest" href="/site.webmanifest">>
    
    <meta charset="UTF-8">
    <title>VolForecaster Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #0b1c2c;
            color: white;
        }
        .container {
            padding: 20px;
        }
        .title {
            font-size: 24px;
            margin-bottom: 20px;
        }
        .grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
        }
        .box {
            background: #122b45;
            padding: 20px;
            border-radius: 10px;
        }
        #chart {
            height: 400px;
        }
    </style>
</head>

<body>
<div class="container">

    <div class="title">📊 VolForecaster Dashboard</div>

    <div class="grid">

        <!-- 左边：走势图 -->
        <div class="box">
            <h3>Commodity Index Trend</h3>
            <div id="chart"></div>
        </div>

        <!-- 右边：数据卡 -->
        <div class="box">
            <h3>Market Snapshot</h3>
            <p>Oil: +2.35%</p>
            <p>Gold: +0.95%</p>
            <p>Iron Ore: -0.81%</p>
        </div>

    </div>

</div>

<script>
var chart = echarts.init(document.getElementById('chart'));

var option = {
    backgroundColor: '#122b45',
    xAxis: {
        type: 'category',
        data: ['Jan','Feb','Mar','Apr','May','Jun'],
        axisLine: { lineStyle: { color: '#fff' } }
    },
    yAxis: {
        type: 'value',
        axisLine: { lineStyle: { color: '#fff' } }
    },
    series: [{
        data: [120, 132, 101, 134, 90, 230],
        type: 'line',
        smooth: true
    }]
};

chart.setOption(option);
</script>

</body>
</html>
